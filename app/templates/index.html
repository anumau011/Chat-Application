<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Private Chat App</title>
    <script src="https://cdn.socket.io/4.0.0/socket.io.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .app-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            width: 95%;
            max-width: 1200px;
            height: 85vh;
            display: flex;
            overflow: hidden;
        }

        .sidebar {
            width: 300px;
            background: #f8f9fa;
            border-radius: 20px 0 0 20px;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #e9ecef;
        }

        .sidebar-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
            border-radius: 20px 0 0 0;
        }

        .sidebar-header h2 {
            font-size: 18px;
            margin-bottom: 5px;
        }

        .current-user {
            background: rgba(255, 255, 255, 0.2);
            padding: 10px;
            border-radius: 10px;
            margin-top: 10px;
            font-size: 14px;
        }

        .users-section {
            padding: 20px;
            flex: 1;
            overflow-y: auto;
        }

        .section-title {
            font-size: 14px;
            font-weight: 600;
            color: #666;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .user-item {
            display: flex;
            align-items: center;
            padding: 12px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 8px;
            border: 2px solid transparent;
        }

        .user-item:hover {
            background: #e9ecef;
            transform: translateX(5px);
        }

        .user-item.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: #667eea;
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            margin-right: 12px;
            font-size: 16px;
        }

        .user-item.active .user-avatar {
            background: rgba(255, 255, 255, 0.2);
        }

        .user-info {
            flex: 1;
        }

        .user-name {
            font-weight: 600;
            font-size: 14px;
        }

        .user-status {
            font-size: 12px;
            opacity: 0.7;
            margin-top: 2px;
        }

        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: white;
            border-radius: 0 20px 20px 0;
        }

        .chat-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-radius: 0 20px 0 0;
        }

        .chat-header h3 {
            font-size: 18px;
        }

        .chat-header .status {
            font-size: 14px;
            opacity: 0.8;
        }

        .welcome-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #666;
            text-align: center;
            padding: 40px;
        }

        .welcome-screen i {
            font-size: 64px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .welcome-screen h3 {
            font-size: 24px;
            margin-bottom: 10px;
        }

        .welcome-screen p {
            font-size: 16px;
            opacity: 0.7;
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f8f9fa;
        }

        .message {
            margin-bottom: 15px;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.own {
            text-align: right;
        }

        .message-bubble {
            display: inline-block;
            max-width: 70%;
            padding: 12px 18px;
            border-radius: 20px;
            position: relative;
            word-wrap: break-word;
        }

        .message.own .message-bubble {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-bottom-right-radius: 5px;
        }

        .message:not(.own) .message-bubble {
            background: white;
            color: #333;
            border: 1px solid #e9ecef;
            border-bottom-left-radius: 5px;
        }

        .message-info {
            font-size: 12px;
            opacity: 0.7;
            margin-bottom: 5px;
        }

        .message.own .message-info {
            text-align: right;
        }

        .message-input-container {
            padding: 20px;
            background: white;
            border-top: 1px solid #eee;
            border-radius: 0 0 20px 0;
        }

        .message-input {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .message-input input {
            flex: 1;
            padding: 15px 20px;
            border: 2px solid #e9ecef;
            border-radius: 25px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }

        .message-input input:focus {
            border-color: #667eea;
        }

        .send-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            border: none;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            cursor: pointer;
            transition: all 0.3s;
        }

        .send-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .username-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
        }

        .modal-content h2 {
            margin-bottom: 20px;
            color: #333;
        }

        .modal-content input {
            width: 100%;
            padding: 15px;
            border: 2px solid #e9ecef;
            border-radius: 25px;
            font-size: 16px;
            margin-bottom: 20px;
            outline: none;
            transition: border-color 0.3s;
        }

        .modal-content input:focus {
            border-color: #667eea;
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            font-size: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .hidden {
            display: none !important;
        }

        /* Scrollbar Styling */
        .messages-container::-webkit-scrollbar,
        .users-section::-webkit-scrollbar {
            width: 6px;
        }

        .messages-container::-webkit-scrollbar-track,
        .users-section::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }

        .messages-container::-webkit-scrollbar-thumb,
        .users-section::-webkit-scrollbar-thumb {
            background: #c1c1c1;
            border-radius: 10px;
        }

        .messages-container::-webkit-scrollbar-thumb:hover,
        .users-section::-webkit-scrollbar-thumb:hover {
            background: #a8a8a8;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .app-container {
                width: 100%;
                height: 100vh;
                border-radius: 0;
            }

            .sidebar {
                width: 250px;
                border-radius: 0;
            }

            .sidebar-header {
                border-radius: 0;
            }

            .chat-area {
                border-radius: 0;
            }

            .chat-header {
                border-radius: 0;
            }

            .message-input-container {
                border-radius: 0;
            }
        }
    </style>
</head>
<body>
    <!-- Username Modal -->
    <div id="username-modal" class="username-modal">
        <div class="modal-content">
            <h2><i class="fas fa-user"></i> Join Private Chat</h2>
            <input type="text" id="username-input" placeholder="Enter your username..." maxlength="20">
            <button class="btn" onclick="joinChat()">
                <i class="fas fa-sign-in-alt"></i> Join Chat
            </button>
        </div>
    </div>

    <!-- Main App -->
    <div id="app-container" class="app-container hidden">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-header">
                <h2><i class="fas fa-comments"></i> Private Chat</h2>
                <div class="current-user">
                    <i class="fas fa-user-circle"></i> <span id="current-username"></span>
                </div>
            </div>
            <div class="users-section">
                <div class="section-title">Online Users</div>
                <div id="users-list">
                    <!-- Users will be populated here -->
                </div>
            </div>
        </div>

        <!-- Chat Area -->
        <div class="chat-area">
            <div id="welcome-screen" class="welcome-screen">
                <i class="fas fa-comments"></i>
                <h3>Welcome to Private Chat</h3>
                <p>Select a user from the sidebar to start a private conversation</p>
            </div>

            <div id="chat-screen" class="hidden">
                <div class="chat-header">
                    <div>
                        <h3 id="chat-with-user">Chat with User</h3>
                        <div class="status">Private conversation</div>
                    </div>
                </div>

                <div class="messages-container" id="messages">
                    <!-- Messages will be displayed here -->
                </div>

                <div class="message-input-container">
                    <div class="message-input">
                        <input type="text" id="message-input" placeholder="Type your message..." maxlength="500">
                        <button class="send-btn" onclick="sendMessage()">
                            <i class="fas fa-paper-plane"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const socket = io();
        let currentUsername = '';
        let currentRoomId = '';
        let currentChatUser = '';

        // DOM elements
        const usernameModal = document.getElementById('username-modal');
        const appContainer = document.getElementById('app-container');
        const usernameInput = document.getElementById('username-input');
        const currentUsernameSpan = document.getElementById('current-username');
        const usersList = document.getElementById('users-list');
        const welcomeScreen = document.getElementById('welcome-screen');
        const chatScreen = document.getElementById('chat-screen');
        const messagesContainer = document.getElementById('messages');
        const messageInput = document.getElementById('message-input');
        const chatWithUser = document.getElementById('chat-with-user');

        // Join chat
        function joinChat() {
            const username = usernameInput.value.trim();
            if (username) {
                currentUsername = username;
                socket.emit('join_chat', { username: username });
            }
        }

        // Start private chat with user
        function startPrivateChat(targetUser) {
            if (targetUser === currentUsername) return;
            
            currentChatUser = targetUser;
            socket.emit('start_private_chat', { target_user: targetUser });
            
            // Update UI
            updateActiveUser(targetUser);
            welcomeScreen.classList.add('hidden');
            chatScreen.classList.remove('hidden');
            chatWithUser.textContent = `Chat with ${targetUser}`;
            messageInput.focus();
        }

        // Send message
        function sendMessage() {
            const message = messageInput.value.trim();
            if (message && currentRoomId) {
                socket.emit('send_private_message', {
                    room_id: currentRoomId,
                    message: message
                });
                messageInput.value = '';
            }
        }

        // Display message in chat
        function displayMessage(messageData, isOwn = false) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isOwn ? 'own' : ''}`;
            
            messageDiv.innerHTML = `
                <div class="message-info">
                    ${isOwn ? 'You' : messageData.username} • ${messageData.timestamp}
                </div>
                <div class="message-bubble">
                    ${escapeHtml(messageData.message)}
                </div>
            `;
            
            messagesContainer.appendChild(messageDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        // Update users list
        function updateUsersList(users) {
            usersList.innerHTML = '';
            users.forEach(username => {
                if (username !== currentUsername) {
                    const userItem = document.createElement('div');
                    userItem.className = 'user-item';
                    userItem.onclick = () => startPrivateChat(username);
                    
                    userItem.innerHTML = `
                        <div class="user-avatar">${username.charAt(0).toUpperCase()}</div>
                        <div class="user-info">
                            <div class="user-name">${username}</div>
                            <div class="user-status">Online</div>
                        </div>
                    `;
                    
                    usersList.appendChild(userItem);
                }
            });
        }

        // Update active user
        function updateActiveUser(username) {
            document.querySelectorAll('.user-item').forEach(item => {
                item.classList.remove('active');
                if (item.querySelector('.user-name').textContent === username) {
                    item.classList.add('active');
                }
            });
        }

        // Escape HTML to prevent XSS
        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, function(m) { return map[m]; });
        }

        // Socket event listeners
        socket.on('join_success', function(data) {
            currentUsernameSpan.textContent = data.username;
            usernameModal.classList.add('hidden');
            appContainer.classList.remove('hidden');
        });

        socket.on('user_list_update', function(users) {
            updateUsersList(users);
        });

        socket.on('private_chat_started', function(data) {
            currentRoomId = data.room_id;
            messagesContainer.innerHTML = '';
            data.messages.forEach(message => {
                displayMessage(message, message.username === currentUsername);
            });
        });

        socket.on('private_chat_invitation', function(data) {
            if (data.from_user === currentChatUser) {
                currentRoomId = data.room_id;
                messagesContainer.innerHTML = '';
                data.messages.forEach(message => {
                    displayMessage(message, message.username === currentUsername);
                });
            }
        });

        socket.on('new_private_message', function(messageData) {
            if (messageData.room_id === currentRoomId) {
                displayMessage(messageData, messageData.username === currentUsername);
            }
        });

        // Event listeners
        usernameInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                joinChat();
            }
        });

        messageInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        // Focus username input on load
        window.addEventListener('load', function() {
            usernameInput.focus();
        });
    </script>
</body>
</html>
